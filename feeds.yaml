# Site-wide settings
site:
  title: Missing RSS
  description: RSS feeds for sites that don't have one
  # base_url: https://brabadu.github.io/missing-rss  # defaults to the SITE_URL env variable

# The LLM (via OpenRouter) finds CSS selectors for feeds that don't define them manually.
# The key is read from the OPENROUTER_API_KEY environment variable (a repository secret).
llm:
  # Models to try first, in order. Models that no longer exist on OpenRouter are skipped.
  models: []
  #  - deepseek/deepseek-chat-v3-0324:free
  free_models: true    # then every free model OpenRouter currently lists, best benchmarks first
  max_models: 5        # how many models that actually answer to try per feed
  repair_rounds: 1     # how many times to ask a model to fix selectors that failed validation
  # Models never to use; "*" matches any characters.
  exclude:
    - thinkingmachines/inkling*   # free tier works only inside listed agent apps (HTTP 403 via the API)
  # max_html_chars: 60000

# Feeds. Only id and url are required:
#   id        — feed file name (<id>.xml)
#   url       — page that lists the publications
#   title     — (optional) feed title; defaults to the page <title>
#   selectors — (optional) manual selectors {item, title, link, date, description}; the LLM is not used then
#   wait_for  — (optional) selector to wait for after the page loads
#   min_items — (optional) minimum number of items for selectors to count as working (3)
#   max_items — (optional) how many items to keep in the feed (50)
feeds:
  - id: anthropic-engineering
    title: Anthropic Engineering
    url: https://www.anthropic.com/engineering

  - id: meta-ai-blog
    title: Meta AI Developer Blog
    url: https://dev.meta.ai/resources/blog

  - id: shopify-engineering
    title: Shopify Engineering
    url: https://shopify.engineering/latest

  - id: x-engineering
    title: X Engineering Blog
    url: https://blog.x.com/en/engineering

  - id: linkedin-engineering
    title: LinkedIn Engineering
    url: https://www.linkedin.com/blog/engineering
