# Глобальні налаштування сайту
site:
  title: Missing RSS
  description: RSS-фіди для сайтів, у яких їх немає
  # base_url: https://brabadu.github.io/missing-rss  # якщо не задано — береться з env SITE_URL

# Список фідів. Поля:
#   id           — ім'я файлу фіду (<id>.xml)
#   title        — назва фіду
#   url          — сторінка зі списком публікацій
#   item         — CSS-селектор одного елемента списку (картки статті)
#   title_selector       — (опц.) селектор заголовка всередині item; за замовчуванням — текст item
#   link_selector        — (опц.) селектор посилання всередині item; за замовчуванням — сам item (якщо це <a>) або перший <a>
#   date_selector        — (опц.) селектор дати; береться атрибут datetime або текст
#   description_selector — (опц.) селектор опису/анонсу
#   wait_for     — (опц.) селектор, якого чекати перед парсингом (за замовчуванням = item)
#   max_items    — (опц.) скільки елементів тримати у фіді (за замовчуванням 50)
feeds:
  - id: anthropic-engineering
    title: Anthropic Engineering
    url: https://www.anthropic.com/engineering
    item: "article[data-listing-row]"
    title_selector: h3
    link_selector: h3 a
    date_selector: time
